<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DHARAWATCH">
  <defs>
    <linearGradient id="drop" x1="20" y1="10" x2="44" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- dark tile -->
  <rect width="64" height="64" rx="14" fill="#06080c"/>
  <!-- satellite orbit (back half) -->
  <path d="M7 40 C 7 28, 57 20, 57 30" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
  <!-- water drop -->
  <path d="M32 8 C 32 8 15 27 15 39 a17 17 0 0 0 34 0 C 49 27 32 8 32 8 Z" fill="url(#drop)"/>
  <!-- watershed: main river + tributaries draining to one outlet -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 50 V 26" stroke-width="2.8"/>
    <path d="M32 42 L 24 34" stroke-width="2.2"/>
    <path d="M32 36 L 40 29" stroke-width="2.2"/>
    <path d="M24 34 L 22 29" stroke-width="1.6"/>
    <path d="M27 38 L 23 39" stroke-width="1.6"/>
  </g>
  <!-- satellite orbit (front half) + satellite -->
  <path d="M57 30 C 57 40, 7 50, 7 40" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="53" cy="38.5" r="3.6" fill="#fbbf24" stroke="#06080c" stroke-width="1.5"/>
</svg>
